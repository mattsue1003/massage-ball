<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="按摩球影音資料庫：點選解剖肌肉巨人的部位或痠痛問題，找到單顆按摩球的教學影片並直接跳到示範片段。">
<meta name="color-scheme" content="light">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>按摩球影音資料庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: 解剖圖版式。左側巨大的正面＋背面肌肉巨人（點選部位或痛點），右側為影片面板；手機改上下排列、單面切換 */
:root {
  color-scheme: light;
  --bg: #f4efe4;
  --paper: #fbf8f1;
  --ink: #2a211d;
  --muted: #7b6d62;
  --line: #e1d6c4;
  --oxblood: #8a2a22;
  --oxblood-soft: #f1dcd3;
  --gold: #c98a1e;
  --ball: #c9631a;
  --ball-soft: #f8e6d4;
  --warn: #9b3020;
  --f-display: "Noto Serif TC", "Songti TC", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1400px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: var(--oxblood); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

header.top { padding-block: 22px 12px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: end; justify-content: space-between; }
header.top h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(26px, 3.6vw, 38px); line-height: 1.15; margin: 0; letter-spacing: .02em; text-wrap: balance; }
header.top h1 small { display: block; font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: .22em; color: var(--muted); margin-bottom: 4px; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }
@media (max-width: 600px) { .stats { display: none; } header.top { padding-block: 16px 10px; } }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); border-block: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-block: 9px; }
.tabs { display: flex; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.tabs button { border: 0; background: none; padding: 7px 16px; border-radius: 7px; font-weight: 700; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--oxblood); color: var(--paper); }
.search { flex: 1 1 240px; position: relative; min-width: 0; }
.search input { width: 100%; padding: 9px 14px 9px 36px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); font: inherit; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--muted); fill: none; stroke-width: 2; }
.toggles { display: flex; gap: 6px; flex-wrap: wrap; }
@media (max-width: 600px) { .toggles { flex-wrap: nowrap; overflow-x: auto; width: 100%; padding-bottom: 2px; scrollbar-width: none; } .toggles::-webkit-scrollbar { display: none; } .tog { white-space: nowrap; flex: none; } .tabs { width: 100%; } .tabs button { flex: 1; } }
.tog { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--muted); }
.tog[aria-pressed="true"] { border-color: var(--oxblood); color: var(--oxblood); background: var(--oxblood-soft); }

main.wrap { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(340px, .8fr); gap: 28px; padding-block: 16px 60px; align-items: start; }
@media (max-width: 900px) { main.wrap { grid-template-columns: minmax(0, 1fr); } }

/* ---- 巨人舞台：多角度轉盤 ---- */
.stage { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 62px); height: calc(100vh - 80px); min-height: 560px; max-height: 1080px;
  background: radial-gradient(ellipse 80% 70% at 50% 40%, #fbf6ec, var(--bg) 75%);
  border: 1px solid var(--line); border-radius: 18px; overflow: hidden; perspective: 1800px; perspective-origin: 50% 45%; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; }
.stage.drag { cursor: grabbing; }
.stage.hot { cursor: pointer; }
.stage .plate { position: absolute; inset: 10px; border: 1px solid var(--line); border-radius: 12px; pointer-events: none; }
.turn { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; will-change: transform; }
.face { position: absolute; inset: 0; opacity: 0; visibility: hidden; }
.face.on { opacity: 1; visibility: visible; }
.face.mirror { transform: scaleX(-1); }
.face img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; -webkit-user-drag: none; filter: drop-shadow(0 18px 22px rgba(70,30,20,.28)); opacity: 0; transition: opacity .5s; }
.face.ready img { opacity: 1; }
.face svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.pt { fill: transparent; stroke: transparent; stroke-width: 3; cursor: pointer; transition: fill .15s, stroke .15s; }
.pt:hover { fill: rgba(201,138,30,.26); stroke: rgba(201,138,30,.9); }
.pt.sel { fill: rgba(201,138,30,.36); stroke: #c98a1e; stroke-width: 4; filter: drop-shadow(0 0 10px rgba(201,138,30,.8)); }
.probs .pt { pointer-events: none; }
.stage:not(.probs) .marks { display: none; }
.mk { cursor: pointer; }
.mk circle.hit { fill: transparent; }
.mk circle.dot { fill: #fbf8f1; stroke: #8a2a22; stroke-width: 4; transition: r .15s; }
.mk text { font-family: var(--f-mono); font-size: 26px; font-weight: 500; fill: #8a2a22; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.mk circle.ring { fill: none; stroke: #c98a1e; stroke-width: 3; opacity: 0; }
.mk:hover circle.dot, .mk.sel circle.dot { fill: #8a2a22; stroke: #c98a1e; }
.mk:hover text, .mk.sel text { fill: #fbf8f1; }
.mk.sel circle.dot { r: 28; }
@media (prefers-reduced-motion: no-preference) {
  .mk circle.ring { animation: pulse 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(2.4); } }
}
.shadow { position: absolute; left: 50%; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(60,25,15,.32), rgba(60,25,15,0) 70%); pointer-events: none; }
.views { position: absolute; top: 14px; right: 14px; display: flex; gap: 2px; z-index: 2; background: rgba(251,248,241,.94); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.views button { border: 0; background: none; padding: 6px 11px; border-radius: 7px; font-size: 13px; color: var(--muted); min-height: 32px; }
.views button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.hint { position: absolute; left: 18px; top: 16px; z-index: 2; font-size: 13px; color: var(--muted); max-width: 44%; line-height: 1.45; pointer-events: none; }
.hint b { color: var(--oxblood); }
.selbadge { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); z-index: 2; background: var(--oxblood); color: var(--paper); font-family: var(--f-display); font-weight: 700; font-size: 16px; padding: 6px 16px; border-radius: 999px; box-shadow: 0 6px 16px rgba(60,20,10,.25); pointer-events: none; }
.keys { position: absolute; left: 18px; bottom: 14px; z-index: 2; font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; pointer-events: none; max-width: 70%; }
.keys kbd { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--paper); color: var(--ink); }
.keys.touch { display: none; font-family: var(--f-body); letter-spacing: 0; font-size: 12px; }
.figtag { position: absolute; right: 18px; bottom: 14px; z-index: 2; font-family: var(--f-mono); font-size: 11px; letter-spacing: .2em; color: var(--muted); pointer-events: none; }
.tip { position: absolute; z-index: 3; pointer-events: none; background: var(--ink); color: var(--paper); font-size: 13px; padding: 4px 10px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -140%); opacity: 0; transition: opacity .12s; }
.tip.on { opacity: 1; }
.tip small { color: #e6c98f; margin-left: 6px; }
.totop { display: none; position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 8; border: 1px solid var(--line); background: var(--ink); color: var(--paper); border-radius: 999px; padding: 9px 18px; font-size: 14px; box-shadow: 0 8px 20px rgba(40,20,10,.3); }
@media (hover: none), (max-width: 900px) {
  .keys:not(.touch) { display: none; } .keys.touch { display: flex; }
  .pt:hover { fill: transparent; stroke: transparent; }
}
@media (max-width: 900px) {
  .stage { position: relative; top: 0; height: 68vh; min-height: 440px; max-height: 720px; border-radius: 14px; }
  .hint { max-width: calc(100% - 36px); font-size: 12px; top: 12px; }
  .views { top: auto; bottom: 12px; left: 50%; right: auto; transform: translateX(-50%); width: max-content; white-space: nowrap; }
  .views button { padding: 7px 10px; }
  .keys.touch { bottom: auto; top: 34px; }
  .selbadge { bottom: 62px; }
  .figtag { display: none; }
  .totop:not([hidden]) { display: block; }
}
@media (max-width: 600px) { .bar { position: static; } }

.legendchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
@media (max-width: 600px) { .legendchips { flex-wrap: nowrap; overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 4px; margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); scrollbar-width: none; } .legendchips::-webkit-scrollbar { display: none; } .chip { flex: none; scroll-snap-align: start; } }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 6px 11px; min-height: 34px; font-size: 13px; display: inline-flex; gap: 6px; align-items: baseline; }
.chip .n { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.chip:hover { border-color: var(--oxblood); }
.chip[aria-pressed="true"] { background: var(--oxblood); border-color: var(--oxblood); color: var(--paper); }
.chip[aria-pressed="true"] .n { color: var(--paper); }

/* ---- 影片面板 ---- */
.panel { min-width: 0; }
.info { background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--oxblood); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; display: grid; gap: 6px; }
.info .eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .18em; color: var(--muted); }
.info h2 { font-family: var(--f-display); font-weight: 900; font-size: 26px; margin: 0; line-height: 1.2; }
.info dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 14px; }
.info dt { color: var(--muted); }
.info dd { margin: 0; }
.info .clear { justify-self: start; border: 0; background: none; color: var(--oxblood); padding: 0; font-size: 13px; text-decoration: underline; }
.intro { background: var(--paper); border: 1px dashed var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
.intro h2 { font-family: var(--f-display); font-size: 22px; margin: 0 0 4px; }
.intro p { margin: 0; color: var(--muted); font-size: 14px; }
.resulthead { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.list { display: grid; gap: 12px; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 15px 16px; min-width: 0; }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.badge { border-radius: 5px; padding: 0 7px; font-size: 12px; font-weight: 500; border: 1px solid var(--line); }
.badge.tw { color: var(--oxblood); border-color: var(--oxblood); }
.badge.intl { color: var(--ball); border-color: var(--ball); }
.card h4 { margin: 6px 0 2px; font-size: 16px; line-height: 1.45; font-weight: 700; }
.card .ch { color: var(--muted); font-size: 13px; }
.card .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.tag { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 0; }
.tag:hover { color: var(--oxblood); }
.segs { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 7px; }
.seg { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; padding: 9px 11px; border-radius: 10px; background: var(--bg); }
.seg.hit { background: var(--ball-soft); }
.time { font-family: var(--f-mono); font-size: 13px; min-height: 30px; font-variant-numeric: tabular-nums; text-decoration: none; background: var(--paper); color: var(--ball); border: 1px solid var(--ball); padding: 2px 8px; border-radius: 6px; white-space: nowrap; align-self: start; display: inline-flex; gap: 5px; align-items: center; }
.time:hover { background: var(--ball); color: var(--paper); }
.time svg { width: 10px; height: 10px; fill: currentColor; }
.seg .lbl { font-weight: 700; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.kind { font-size: 11px; font-weight: 500; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.kind.ball { border-color: var(--oxblood); color: var(--oxblood); }
.seg .desc { grid-column: 2; font-size: 14px; }
@media (max-width: 520px) { .seg { grid-template-columns: minmax(0, 1fr); } .seg .desc { grid-column: 1; } .time { justify-self: start; } }
.more { margin-top: 8px; border: 0; background: none; color: var(--oxblood); font-size: 13px; padding: 0; }
.empty { padding: 36px 20px; text-align: center; color: var(--muted); background: var(--paper); border: 1px dashed var(--line); border-radius: 14px; }

.guide { display: grid; gap: 18px; grid-column: 1 / -1; max-width: 900px; }
.guide section { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; min-width: 0; }
.guide h2 { font-family: var(--f-display); font-weight: 900; font-size: 24px; margin: 0 0 4px; }
.guide .sub { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
.rules { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; }
.rules b { color: var(--warn); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.steps li { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 12px; align-items: start; }
.steps .min { font-family: var(--f-mono); font-size: 13px; color: var(--ball); padding-top: 2px; }
.steps h5 { margin: 0; font-size: 15px; }
.steps p { margin: 2px 0 4px; font-size: 14px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 14px; }
th, td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
thead th { font-size: 13px; color: var(--muted); }
tbody th { white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>


<header class="top wrap">
  <h1><small>MASSAGE BALL · ANATOMICAL ATLAS</small>按摩球影音資料庫</h1>
  <div class="stats" id="stats"></div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-parts" data-tab="parts" aria-selected="true">依部位</button>
      <button role="tab" id="tab-probs" data-tab="probs" aria-selected="false">依問題</button>
      <button role="tab" id="tab-guide" data-tab="guide" aria-selected="false">使用指南</button>
    </div>
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜尋肌肉、症狀、頻道，例如「腰方肌」「發麻」" autocomplete="off">
    </label>
    <div class="toggles" id="toggles">
      <button class="tog" id="f-tw" data-f="tw" aria-pressed="false">台灣頻道</button>
      <button class="tog" id="f-intl" data-f="intl" aria-pressed="false">國際頻道</button>
      <button class="tog" id="f-short" data-f="short" aria-pressed="false">Shorts</button>
      <button class="tog" id="f-ball" data-f="ball" aria-pressed="false">只看按摩球段落</button>
    </div>
  </div>
</div>

<main class="wrap" id="main">
  <div id="stageCol">
    <div class="stage" id="stage" aria-label="可旋轉的解剖肌肉巨人">
      <div class="plate"></div>
      <div class="shadow" id="shadow"></div>
      <div class="turn" id="turn"></div>
      <div class="hint" id="hint"></div>
      <div class="views" id="views" role="group" aria-label="視角">
        <button data-v="front">正面</button>
        <button data-v="side">側面</button>
        <button data-v="back">背面</button>
        <button data-v="spin" aria-pressed="false">自動旋轉</button>
        <button data-v="reset" title="雙擊畫面也可重置">重置</button>
      </div>
      <div class="selbadge" id="selbadge" hidden></div>
      <div class="keys"><span><kbd>拖曳</kbd> 旋轉</span><span><kbd>滾輪</kbd> 縮放</span><span><kbd>A D</kbd> 繞行</span><span><kbd>W S</kbd> 走近走遠</span><span><kbd>Shift+拖曳</kbd> 平移</span></div>
      <div class="keys touch"><span>單指左右滑動旋轉 · 雙指縮放 · 點肌肉看影片</span></div>
      <div class="figtag">FIG. 1 · MUSCULAR GIANT</div>
      <div class="tip" id="tip"></div>
    </div>
    <div class="legendchips" id="chips"></div>
  </div>
  <div class="panel" id="panel" aria-live="polite"></div>
  <button class="totop" id="totop" hidden>▲ 回到巨人</button>
</main>

<script>
const PARTS = {
  neck:    { n: "頭頸部後側", m: "枕下肌群、提肩胛肌、上斜方肌", q: "頸因性頭痛、落枕轉頭受限、後腦勺脹痛" },
  chest:   { n: "胸部正面", m: "胸大肌、胸小肌、鎖骨下肌", q: "圓肩駝背、胸悶、肩關節前側卡痛" },
  side:    { n: "側胸與前鋸肌", m: "前鋸肌、肋間肌", q: "翼狀肩胛、舉手過頭卡痛、側胸岔氣" },
  shoulder:{ n: "肩關節旋轉肌袖", m: "肩胛下肌、棘下肌、小圓肌、大圓肌", q: "五十肩、內外旋受限、手伸不到後背" },
  arm:     { n: "上臂", m: "肱三頭肌、肱二頭肌、三角肌、肌間隔", q: "手肘伸直痛、推舉手肘卡響" },
  forearm: { n: "前臂與手掌", m: "伸腕/屈腕肌群、旋前圓肌、大小魚際肌", q: "網球肘、高爾夫球肘、滑鼠手、媽媽手" },
  upper:   { n: "上背與胸椎旁", m: "菱形肌、胸髂肋肌、胸半棘肌、胸最長肌", q: "膏肓痛、夾背痠痛、胸椎僵硬" },
  lowback: { n: "下背部", m: "腰方肌、豎脊肌腰段、胸腰筋膜", q: "久坐起身腰痠、翻身腰痛、單側骨盆上提" },

  v.probs = [...new Set(v.segs.flatMap(s => s.probs))];
});

const state = { tab: "parts", part: null, prob: null, q: "", tw: false, intl: false, short: false, ball: false, view: "both", open: new Set() };
try { const t = localStorage.getItem("mb-tab"); if (t) state.tab = t; } catch (e) {}

function segText(v, s) {
  return [v.t, v.ch, s.l, s.d, ...s.parts.map(p => PARTS[p].n + PARTS[p].m), ...s.probs.map(p => PROBS[p].n + PROBS[p].s)].join(" ").toLowerCase();
}
function segMatch(v, s, part = state.tab === "parts" ? state.part : null, prob = state.tab === "probs" ? state.prob : null) {
  if (state.ball && s.k !== "ball") return false;
  if (part && !s.parts.includes(part)) return false;
  if (prob && !s.probs.includes(prob)) return false;
  if (state.q) { const txt = segText(v, s); if (!state.q.toLowerCase().split(/\s+/).filter(Boolean).every(t => txt.includes(t))) return false; }
  return true;
}
function videoPass(v) {
  if (state.tw !== state.intl) { if (state.tw && !v.tw) return false; if (state.intl && !v.intl) return false; }
  return !(state.short && !v.short);
}
const countPart = p => VIDEOS.filter(v => videoPass(v) && v.segs.some(s => segMatch(v, s, p, null))).length;
const countProb = p => VIDEOS.filter(v => videoPass(v) && v.segs.some(s => segMatch(v, s, null, p))).length;

// ---------- render ----------
function renderStats() {
  const segN = VIDEOS.reduce((a, v) => a + v.segs.filter(s => s.a).length, 0);
  $("#stats").innerHTML = `<span><b>${VIDEOS.length}</b> 支影片</span><span><b>${segN}</b> 個時間片段</span><span><b>${Object.keys(PARTS).length}</b> 個部位</span><span><b>${Object.keys(PROBS).length}</b> 種問題</span>`;
}
function renderStage() {
  G.setMode(state.tab, state.part, state.prob);
  $("#hint").innerHTML = state.tab === "parts" ? "點選巨人身上的<b>肌肉</b>，就會列出該部位的按摩球影片" : "點選巨人身上的<b>編號痛點</b>，查看對應問題的影片";
  const isP = state.tab === "parts";
  $("#chips").innerHTML = isP
    ? Object.keys(PARTS).map(k => `<button class="chip" data-part="${k}" aria-pressed="${state.part === k}">${esc(PARTS[k].n)}<span class="n">${countPart(k)}</span></button>`).join("")
    : PROB_ORDER.map((k, i) => `<button class="chip" data-prob="${k}" aria-pressed="${state.prob === k}"><span class="n">${i + 1}</span>${esc(PROBS[k].n)}<span class="n">${countProb(k)}</span></button>`).join("");
}
function segHTML(v, s, hit) {
  const play = `<svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg>`;
  const time = s.a ? `<a class="time" href="${url(v.id, s.a)}" target="_blank" rel="noopener" title="在 YouTube 從 ${s.a} 開始播放">${play}${s.a}${s.b ? "–" + s.b : ""}</a>`
    : `<a class="time" href="${url(v.id)}" target="_blank" rel="noopener">${play}${v.short ? "全片" : "觀看"}</a>`;
  return `<li class="seg${hit ? " hit" : ""}">${time}<div class="lbl">${esc(s.l)}<span class="kind ${s.k}">${KINDS[s.k]}</span></div><div class="desc">${esc(s.d)}</div></li>`;
}
function cardHTML(v, filtering) {
  const hits = v.segs.filter(s => segMatch(v, s));
  const rest = v.segs.length - hits.length;
  const open = state.open.has(v.id) || !filtering;
  const shown = open ? v.segs : hits;
  const tags = [...v.parts.map(p => `<button class="tag" data-part="${p}">${esc(PARTS[p].n)}</button>`), ...v.probs.map(p => `<button class="tag" data-prob="${p}">#${esc(PROBS[p].n)}</button>`)].join("");
  return `<article class="card">
    <div class="meta"><span class="badge ${v.tw ? "tw" : "intl"}">${v.tw ? "台灣" : "國際"}</span>${v.short ? '<span class="badge">Shorts</span>' : ""}${v.dur ? `<span>片長 ${v.dur}</span>` : ""}</div>
    <h4>${esc(v.t)}</h4><div class="ch">${esc(v.ch)} · <a href="${url(v.id)}" target="_blank" rel="noopener">YouTube 開啟</a></div>
    <ul class="segs">${shown.map(s => segHTML(v, s, filtering && hits.includes(s))).join("")}</ul>
    ${filtering && rest ? `<button class="more" data-open="${v.id}">${open ? "收合其他段落" : `顯示其他 ${rest} 個段落`}</button>` : ""}
    <div class="tags">${tags}</div></article>`;
}
function renderPanel() {
  const sel = state.tab === "parts" ? state.part : state.prob;
  let head;
  if (sel && state.tab === "parts") head = `<div class="info"><span class="eyebrow">部位</span><h2>${esc(PARTS[sel].n)}</h2><dl><dt>主要肌群</dt><dd>${esc(PARTS[sel].m)}</dd><dt>常見問題</dt><dd>${esc(PARTS[sel].q)}</dd></dl><button class="clear" data-clear>清除選取</button></div>`;
  else if (sel) head = `<div class="info"><span class="eyebrow">問題 ${PROB_ORDER.indexOf(sel) + 1}</span><h2>${esc(PROBS[sel].n)}</h2><dl><dt>典型症狀</dt><dd>${esc(PROBS[sel].s)}</dd></dl><button class="clear" data-clear>清除選取</button></div>`;
  else head = `<div class="intro"><h2>${state.tab === "parts" ? "哪裡緊，就點哪裡" : "哪裡痛，就點哪個編號"}</h2><p>${state.tab === "parts" ? "點左邊巨人的肌肉，或下方的部位標籤。" : "點左邊巨人身上的編號痛點，或下方的問題標籤。"}點時間標籤會直接跳到 YouTube 的示範片段。</p></div>`;
  const filtering = !!sel || !!state.q || state.ball;
  const list = VIDEOS.filter(v => videoPass(v) && v.segs.some(s => segMatch(v, s)));
  const hitSegs = list.reduce((a, v) => a + v.segs.filter(s => segMatch(v, s)).length, 0);
  $("#panel").innerHTML = head + `<div class="resulthead">${sel || state.q ? "" : "全部 · "}${list.length} 支影片 · ${hitSegs} 個片段</div>`
    + (list.length ? `<div class="list">${list.map(v => cardHTML(v, filtering)).join("")}</div>` : `<div class="empty">沒有符合的影片。試試清除搜尋字，或取消上方的頻道篩選。</div>`);
}
function guideHTML() {
  return `<div class="guide">
  <section><h2>單顆按摩球安全準則</h2><p class="sub">物理治療師叮嚀，開始前先看。</p>
    <ol class="rules">
      <li><b>不壓骨頭突起與神經血管處</b>：脊椎正中央棘突、尾椎尖端、膝窩正後方、手肘內側尺神經溝。球要放在兩側的肌肉上。</li>
      <li><b>不要硬滾髂脛束</b>：大腿外側的髂脛束沒有彈性，重壓容易引起滑囊發炎。改放鬆源頭的闊筋膜張肌（褲子前口袋位置）與臀大肌。</li>
      <li><b>痛感控制在 5–6 分（滿分 10）</b>：微痠帶點放鬆感就好。咬牙忍到 8 分以上，肌肉會保護性收縮反彈。</li>
      <li><b>單點停 30–60 秒、滾 10–20 下</b>：過度按壓同一點可能造成皮下瘀血發炎。急性紅腫熱痛時先不要滾動。</li>
      <li><b>壓住再動（Pin and Stretch）</b>：球定點壓住痛點後，主動活動遠端關節，例如壓股四頭肌時屈伸膝蓋、壓前臂時活動手腕、壓足底時張開腳趾。</li>
    </ol>
    <p class="sub" style="margin-top:12px">本資料庫為自我保健參考，不能取代醫療診斷。疼痛持續、夜間痛醒、麻木無力加重時，請就醫或找物理治療師評估。</p>
  </section>
  <section><h2>上班族 5 分鐘辦公室 Routine</h2><p class="sub">不用瑜伽墊、不用躺地，一張椅子、一面牆、一顆球。</p>
    <ol class="steps">${ROUTINE.map(r => `<li><span class="min">${r[0]}</span><div><h5>${r[1]}</h5><p>${r[2]}</p><button class="tag" data-part="${r[3]}">看「${PARTS[r[3]].n}」相關影片 →</button></div></li>`).join("")}</ol>
  </section>
  <section><h2>運動前啟動 vs 運動後放鬆</h2><p class="sub">同一顆球，節奏和力道要依時機調整。</p>
    <div class="tablewrap"><table>
      <thead><tr><th></th><th>運動前動態啟動</th><th>運動後／睡前放鬆</th></tr></thead>
      <tbody>
        <tr><th>目標</th><td>提高神經傳導與血流</td><td>降低肌肉張力、促進修復</td></tr>
        <tr><th>節奏與時間</th><td>快節奏，每部位 15–20 秒</td><td>慢節奏，每個痛點定點 30–60 秒</td></tr>
        <tr><th>技巧</th><td>輕快滾動＋大範圍主動關節活動</td><td>腹式深呼吸、沉降、Pin and Stretch</td></tr>
        <tr><th>痛感</th><td>3–4 分輕度痠感</td><td>5–6 分釋放感，不超過 8 分</td></tr>
        <tr><th>重點部位</th><td>臀中肌、胸椎旁臂動、腓骨肌、足底</td><td>股四頭肌、髂腰肌、胸大小肌、上背、枕下肌</td></tr>
      </tbody></table></div>
  </section>
  <section><h2>片段類型說明</h2>
    <div class="legend">${Object.entries(KINDS).map(([k, n]) => `<span><span class="kind ${k}">${n}</span> ${{ ball: "用按摩球操作的動作", test: "判斷自己是不是這個問題", stretch: "不用球的伸展或神經鬆動", train: "不用球的肌力訓練", info: "原理、定位或觀念" }[k]}</span>`).join("")}</div>
  </section></div>`;
}
function render() {
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === state.tab));
  document.querySelectorAll(".tog").forEach(b => b.setAttribute("aria-pressed", state[b.dataset.f]));
  const guide = state.tab === "guide";
  $("#stageCol").hidden = guide; $("#toggles").hidden = guide;
  if (guide) { $("#panel").innerHTML = guideHTML(); $("#panel").style.gridColumn = "1 / -1"; return; }
  $("#panel").style.gridColumn = "";
  renderStage(); renderPanel();
}
function select(key, val, scroll, toggle = true) {
  const tab = key === "part" ? "parts" : "probs";
  if (state.tab !== tab) { state.tab = tab; state.part = state.prob = null; try { localStorage.setItem("mb-tab", tab); } catch (e) {} }
  state[key] = toggle && state[key] === val ? null : val; state.open.clear();
  render();
  if (scroll && state[key]) {
    if (window.matchMedia("(max-width: 900px)").matches) setTimeout(() => $("#panel").scrollIntoView({ behavior: "smooth", block: "start" }), 350);
    else window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

// ---------- events ----------
const tip = $("#tip");
const G = buildGiant($("#stage"), {
  hover(hit, x, y) {
    let html = "";
    if (hit && hit.part && state.tab === "parts") html = `${esc(PARTS[hit.part].n)}<small>${countPart(hit.part)} 支影片</small>`;
    else if (hit && hit.prob) html = `${esc(PROBS[hit.prob].n)}<small>${countProb(hit.prob)} 支影片</small>`;
    tip.classList.toggle("on", !!html);
    if (html) { tip.innerHTML = html; tip.style.left = x + "px"; tip.style.top = y + "px"; }
  },
  click(hit) {
    if (!hit) return;
    if (hit.part && state.tab === "parts") select("part", hit.part, true);
    else if (hit.prob) select("prob", hit.prob, true);
  },
});
// 手機：影片清單捲過巨人後，顯示「回到巨人」
const totop = $("#totop");
new IntersectionObserver(([en]) => { totop.hidden = en.isIntersecting || state.tab === "guide" || !window.matchMedia("(max-width: 900px)").matches; }, { threshold: 0.08 }).observe($("#stage"));
totop.addEventListener("click", () => $("#stageCol").scrollIntoView({ behavior: "smooth", block: "start" }));
$("#views").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.v === "spin") { const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on); G.spin(on); }
  else G.view(b.dataset.v);
});
document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.tab = b.dataset.tab; state.part = state.prob = null; state.open.clear();
  try { localStorage.setItem("mb-tab", state.tab); } catch (e) {}
  render();
});
$("#toggles").addEventListener("click", e => { const b = e.target.closest(".tog"); if (!b) return; state[b.dataset.f] = !state[b.dataset.f]; render(); });
$("#q").addEventListener("input", e => { state.q = e.target.value.trim(); state.open.clear(); if (state.tab === "guide") state.tab = "parts"; render(); });
document.addEventListener("click", e => {
  const t = e.target.closest("#chips [data-part], #chips [data-prob], #panel [data-part], #panel [data-prob], #panel [data-open], #panel [data-clear]"); if (!t) return;
  const toggle = !!t.closest("#chips");
  if (t.dataset.part) select("part", t.dataset.part, true, toggle);
  else if (t.dataset.prob) select("prob", t.dataset.prob, true, toggle);
  else if (t.dataset.open) { const id = t.dataset.open; state.open.has(id) ? state.open.delete(id) : state.open.add(id); renderPanel(); }
  else { state.part = state.prob = null; render(); }
});

renderStats(); render();
</script>
</body>
</html>
